AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS in front of the FitTrack web app (S3 website bucket). Fixes secure storage and sign-in persistence on iPhone.

Parameters:
  BucketName:
    Type: String
    Default: fittrack-flutter-app
    Description: Existing S3 bucket that serves the app (website hosting enabled)

Resources:
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FitTrack web app
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: s3-website
            DomainName: !Sub ${BucketName}.s3-website-${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              # S3 website endpoints only speak HTTP; the viewer side is HTTPS only.
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized: honours the origin's Cache-Control, so the no-cache entry files stay fresh.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

Outputs:
  AppUrl:
    Description: Open this on the iPhone, then re-add it to the home screen
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
